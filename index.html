<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arkanoid</title>
  <style>
    :root {
      --void: #07070c;
      --bezel: #12121c;
      --bezel-lip: #1e1e2e;
      --edge: rgba( 255, 255, 255, 0.07 );
      --phosphor: #e8f0ff;
      --dim: #666d88;
      --amber: #ffb648;
      --accent: #d2344a;

      --font-display: "Bahnschrift", "DIN Alternate", "Arial Narrow", system-ui, sans-serif;
      --font-mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background:
        radial-gradient( 900px 600px at 50% 38%, #14141f 0%, var(--void) 70% );
      font-family: var(--font-display);
      color: var(--phosphor);
    }

    .cabinet {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    /* ---------- Pantalla + bisel ---------- */

    .stage {
      border-radius: 10px;
      overflow: hidden;
      background: var(--bezel);
      box-shadow:
        0 0 0 1px rgba( 255, 255, 255, 0.06 ),
        0 30px 70px -20px rgba( 0, 0, 0, 0.9 );
    }

    /* 1fr auto 1fr mantiene el nivel ópticamente centrado en el bisel,
       sin importar cuánto crezcan el puntaje o las vidas. */
    .bezel {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      height: 62px;
      padding: 0 18px;
      background: linear-gradient( 180deg, var(--bezel-lip), var(--bezel) 62%, #0c0c14 );
      border-bottom: 1px solid rgba( 0, 0, 0, 0.9 );
      box-shadow: inset 0 1px 0 rgba( 255, 255, 255, 0.09 );
    }

    .readout--level { text-align: center; }

    .bezel__right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
    }

    .readout__label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 3px;
    }

    .readout__value {
      display: block;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 25px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.06em;
    }

    .readout--score .readout__value {
      color: var(--amber);
      text-shadow: 0 0 14px rgba( 255, 182, 72, 0.4 );
    }

    .readout--level .readout__value {
      color: var(--accent);
      text-shadow: 0 0 16px color-mix( in srgb, var(--accent) 55%, transparent );
      transition: color 0.4s ease, text-shadow 0.4s ease;
    }

    .readout--lives { text-align: right; }

    .lives {
      justify-content: flex-end;
      display: flex;
      gap: 7px;
      height: 25px;
      align-items: center;
    }

    .life {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: radial-gradient( circle at 34% 28%, #fff 4%, #c8cede 42%, #6f7689 100% );
      box-shadow: 0 0 9px rgba( 200, 210, 230, 0.35 );
      animation: life-in 0.3s ease backwards;
    }

    @keyframes life-in {
      from { transform: scale( 0.2 ); opacity: 0; }
    }

    .bezel__controls {
      display: flex;
      gap: 2px;
      padding-left: 14px;
      border-left: 1px solid var(--edge);
    }

    .iconbtn {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .iconbtn:hover { background: rgba( 255, 255, 255, 0.07 ); color: var(--phosphor); }
    .iconbtn svg { width: 17px; height: 17px; display: block; }

    .screen {
      position: relative;
      line-height: 0;
    }

    canvas {
      background: #000;
      display: block;
    }

    /* ---------- Overlay ---------- */

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba( 5, 5, 10, 0.78 );
      backdrop-filter: blur( 3px );
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease, visibility 0.25s;
      line-height: normal;
    }

    .overlay.is-open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .overlay__panel {
      text-align: center;
      transform: translateY( 12px );
      transition: transform 0.3s cubic-bezier( 0.2, 0.9, 0.3, 1 );
    }

    .overlay.is-open .overlay__panel { transform: none; }

    .overlay__eyebrow {
      margin: 0 0 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      transition: color 0.4s ease;
    }

    .overlay__title {
      margin: 0 0 28px;
      font-size: 58px;
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1;
    }

    .btn {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--void);
      background: var(--phosphor);
      border: none;
      border-radius: 6px;
      padding: 14px 40px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY( -2px );
      box-shadow: 0 8px 20px -6px rgba( 232, 240, 255, 0.45 );
    }

    /* ---------- Rack de niveles ---------- */

    .rack {
      width: 156px;
      padding: 14px;
      border-radius: 10px;
      background: var(--bezel);
      box-shadow:
        0 0 0 1px rgba( 255, 255, 255, 0.06 ),
        0 30px 70px -20px rgba( 0, 0, 0, 0.9 );
    }

    .rack__title {
      margin: 2px 0 12px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .rack__list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chip {
      display: block;
      width: 100%;
      padding: 9px 10px 10px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: #0b0b12;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
    }

    .chip:hover {
      transform: translateX( 3px );
      border-color: var(--edge);
    }

    .chip__num {
      display: block;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--dim);
      margin-bottom: 7px;
      transition: color 0.18s ease;
    }

    .chip.is-active {
      background: #0f0f18;
      border-color: color-mix( in srgb, var(--chip-accent) 45%, transparent );
    }

    .chip.is-active .chip__num { color: var(--chip-accent); }

    .chip__map {
      display: grid;
      grid-template-columns: repeat( 10, 1fr );
      gap: 2px;
    }

    .cell {
      aspect-ratio: 2 / 1;
      border-radius: 1.5px;
      background: var(--cell, transparent);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .cell.is-void { background: transparent; }

    .cell.is-broken {
      background: transparent;
      box-shadow: inset 0 0 0 1px rgba( 255, 255, 255, 0.1 );
    }

    /* ---------- Accesibilidad ---------- */

    .iconbtn:focus-visible,
    .chip:focus-visible,
    .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* El canvas conserva su sistema de 800x600 al escalarse: los manejadores de
       ratón ya convierten coordenadas con getBoundingClientRect. */
    @media ( max-width: 1040px ) {
      .cabinet { flex-direction: column; align-items: stretch; }
      .stage, .bezel, canvas { width: 100%; }
      canvas { height: auto; }
      .rack { width: 100%; }
      .rack__list { flex-direction: row; }
      .chip { flex: 1; }
      .chip:hover { transform: translateY( -3px ); }
      .overlay__title { font-size: 44px; }
    }

    @media ( prefers-reduced-motion: reduce ) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="cabinet" id="cabinet">
    <div class="stage">
      <header class="bezel">
        <div class="readout readout--score">
          <span class="readout__label">Puntaje</span>
          <span class="readout__value" id="hudScore">0000</span>
        </div>

        <div class="readout readout--level">
          <span class="readout__label">Nivel</span>
          <span class="readout__value" id="hudLevel">1</span>
        </div>

        <div class="bezel__right">
          <div class="readout readout--lives">
            <span class="readout__label">Vidas</span>
            <span class="lives" id="hudLives"></span>
          </div>

          <div class="bezel__controls">
            <button class="iconbtn" id="pauseBtn" aria-label="Pausar"></button>
            <button class="iconbtn" id="muteBtn" aria-label="Silenciar" aria-pressed="false"></button>
          </div>
        </div>
      </header>

      <div class="screen">
        <canvas id="game" width="800" height="600"></canvas>

        <div class="overlay" id="overlay">
          <div class="overlay__panel">
            <p class="overlay__eyebrow" id="overlayEyebrow"></p>
            <h2 class="overlay__title" id="overlayTitle"></h2>
            <button class="btn" id="overlayBtn"></button>
          </div>
        </div>
      </div>
    </div>

    <aside class="rack">
      <h2 class="rack__title">Nivel</h2>
      <div class="rack__list" id="levelButtons"></div>
    </aside>
  </div>

  <script src="assets/spritesheet.js"></script>
  <script src="js/levels.js" defer></script>
  <script src="js/audio.js" defer></script>
  <script src="js/game.js" defer></script>
</body>
</html>
